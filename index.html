<h2 class="sr-only">Control de finanzas personales — tablero mensual de ingresos, egresos y ahorro</h2>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg-main: #0b1215;
    --bg-card: #141f23;
    --bg-input: #1c2a30;
    --border-color: #24373e;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    
    /* Colores temáticos financieros */
    --money-green: #10b981;
    --money-green-hover: #059669;
    --expense-red: #ef4444;
    --fixed-blue: #3b82f6;
    --saving-purple: #8b5cf6;
    --accent-gold: #f59e0b;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 10px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.25rem;
    margin-bottom: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
  }
  
  .mcard {
    background: var(--bg-input);
    border-radius: 12px;
    padding: 1rem;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }
  .mcard:hover {
    border-color: var(--border-color);
    transform: translateY(-2px);
  }

  .tabs-container {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 1.5rem;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }

  .tab-btn {
    padding: 10px 18px;
    background: var(--bg-card);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    border-radius: 20px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.2s ease;
    border: 1px solid var(--border-color);
  }
  .tab-btn.active {
    color: #fff;
    background: var(--money-green);
    border-color: var(--money-green);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
  }
  .tab-btn:hover:not(.active) {
    background: var(--bg-input);
    color: var(--text-main);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-color);
  }
  .row-item:last-child { border-bottom: none; }

  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 10px;
  }
  .form-row input, .form-row select {
    flex: 1;
    min-width: 140px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .form-row input:focus, .form-row select:focus {
    border-color: var(--money-green);
  }
  
  button.btn-action {
    background: var(--money-green);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  button.btn-action:hover { background: var(--money-green-hover); }

  .btn-del {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--expense-red);
    padding: 6px;
    font-size: 16px;
    border-radius: 6px;
    transition: background 0.2s;
  }
  .btn-del:hover { background: rgba(239, 68, 68, 0.1); }

  .pbar { height: 6px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .pbar-f { height: 100%; border-radius: 4px; transition: width .5s ease; }
  
  .tip-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 1.25rem;
    margin-bottom: 12px;
    border-left: 4px solid var(--money-green);
  }
</style>

<div style="padding: 1rem 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
  <div>
    <h1 style="font-size: 22px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px;">
      <i class="ti ti-wallet" style="color: var(--money-green);"></i> MiBilletón Pro Cloud
    </h1>
    <p style="font-size: 13px; color: var(--text-muted); margin: 0;">Sincronizado de forma segura y en tiempo real con Supabase</p>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 30px; padding: 6px 14px;">
    <button id="prevBtn" style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-main);" aria-label="Mes anterior"><i class="ti ti-chevron-left"></i></button>
    <span id="monthLabel" style="font-size: 14px; font-weight: 600; min-width: 110px; text-align: center; text-transform: capitalize;"></span>
    <button id="nextBtn" style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-main);" aria-label="Mes siguiente"><i class="ti ti-chevron-right"></i></button>
  </div>
</div>

<div class="tabs-container" role="tablist">
  <button class="tab-btn active" data-tab="overview" role="tab" aria-selected="true"><i class="ti ti-layout-dashboard"></i>Resumen</button>
  <button class="tab-btn" data-tab="income" role="tab"><i class="ti ti-square-rounded-arrow-down" style="color: var(--money-green);"></i>Ingresos</button>
  <button class="tab-btn" data-tab="expenses" role="tab"><i class="ti ti-square-rounded-arrow-up" style="color: var(--expense-red);"></i>Egresos</button>
  <button class="tab-btn" data-tab="fixed" role="tab"><i class="ti ti-pin" style="color: var(--fixed-blue);"></i>Gastos Fijos</button>
  <button class="tab-btn" data-tab="savings" role="tab"><i class="ti ti-piggy-bank" style="color: var(--saving-purple);"></i>Ahorro</button>
  <button class="tab-btn" data-tab="tips" role="tab"><i class="ti ti-bulb-filled" style="color: var(--accent-gold);"></i>Consejos</button>
</div>

<div id="panel-overview" class="panel active" role="tabpanel">Inicializando sistema...</div>
<div id="panel-income" class="panel" role="tabpanel"></div>
<div id="panel-expenses" class="panel" role="tabpanel"></div>
<div id="panel-fixed" class="panel" role="tabpanel"></div>
<div id="panel-savings" class="panel" role="tabpanel"></div>
<div id="panel-tips" class="panel" role="tabpanel"></div>

<script>
// =============== CONFIGURACIÓN GLOBAL SUPABASE ===============
const SB_URL = "https://pknkexsoidbvseftndos.supabase.co"; 
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrbmtleHNvaWRidnNlZnRuZG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0OTU5NjAsImV4cCI6MjA5NTA3MTk2MH0.n7jBEp608AxcGaGawJCCwyG8cAhEM_R311Z7xTpP5Jo";

let supabase = null;

const MO=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CATS=['Alimentación','Transporte','Vivienda','Salud','Educación','Entretenimiento','Ropa','Tecnología','Servicios','Deudas','Otros'];
const CICO={'Alimentación':'ti-soup','Transporte':'ti-motorbike','Vivienda':'ti-home-2','Salud':'ti-heart-handshake','Educación':'ti-book-2','Entretenimiento':'ti-device-gamepad-2','Ropa':'ti-shirt','Tecnología':'ti-device-laptop','Servicios':'ti-bolt','Deudas':'ti-building-bank','Otros':'ti-package'};
const CC=['#10b981','#3b82f6','#ef4444','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#6366f1','#a855f7','#f43f5e'];

let Y = new Date().getFullYear(), M = new Date().getMonth();
let db_ingresos = [], db_variables = [], db_config_fijos = [], db_abonos_fijos = [], db_ahorros = [];
let currentTab = 'overview';
let ci = null;

const COP = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0,maximumFractionDigits:0}).format(n||0);
const getPeriodo = () => `${Y}_${String(M+1).padStart(2,'0')}`;

const cG=()=>'var(--money-green)';
const cR=()=>'var(--expense-red)';
const cB=()=>'var(--fixed-blue)';
const cP=()=>'var(--saving-purple)';
const cA=()=>'var(--accent-gold)';

// Forzar la validación e inyección asíncrona de la librería externa
function inicializarClienteSeguro() {
  const SupabaseLib = window.supabase || (window.Supabase && window.Supabase.createClient ? window.Supabase : null);
  if (SupabaseLib) {
    if (typeof SupabaseLib.createClient === 'function') {
      supabase = SupabaseLib.createClient(SB_URL, SB_KEY);
    } else if (typeof SupabaseLib === 'function') {
      supabase = SupabaseLib(SB_URL, SB_KEY);
    }
    return true;
  }
  return false;
}

async function init() {
  setupTabs();
  setupMonthNavigation();
  document.getElementById('monthLabel').innerText = `${MO[M]} ${Y}`;
  
  let conecto = inicializarClienteSeguro();
  if (!conecto) {
    await new Promise(resolve => setTimeout(resolve, 400));
    conecto = inicializarClienteSeguro();
  }

  if (!supabase) {
    document.getElementById('panel-overview').innerHTML = `
      <div class="card" style="border-color: var(--expense-red); text-align: center; padding: 2rem;">
        <i class="ti ti-alert-triangle" style="font-size: 42px; color: var(--expense-red);"></i>
        <h3 style="margin: 12px 0 6px;">Error de Enlace CDN</h3>
        <p style="color: var(--text-muted); font-size: 14px; margin:0;">No se pudo instanciar la SDK de Supabase. Refresca la vista o comprueba la red.</p>
      </div>`;
    return;
  }
  await fetchData();
}

async function fetchData() {
  try {
    const per = getPeriodo();
    document.getElementById('monthLabel').innerText = `${MO[M]} ${Y}`;

    const [f1, f2, f3, f4, f5] = await Promise.all([
      supabase.from('config_fijos').select('*'),
      supabase.from('ingresos').select('*').eq('mes_periodo', per),
      supabase.from('gastos_variables').select('*').eq('mes_periodo', per),
      supabase.from('abonos_fijos').select('*').eq('mes_periodo', per),
      supabase.from('ahorros').select('*') // Trae todos los históricos para calcular acumulados
    ]);

    db_config_fijos = f1.data || [];
    db_ingresos = f2.data || [];
    db_variables = f3.data || [];
    db_abonos_fijos = f4.data || [];
    db_ahorros = f5.data || [];

    render();
  } catch (error) {
    console.error("Fallo al sincronizar con Supabase:", error);
  }
}

// Cálculo de Totales del Período
const tI = () => db_ingresos.reduce((s,i) => s + Number(i.monto), 0);
const tF = () => db_config_fijos.reduce((s,f) => s + Number(f.amount), 0);
const tAbonadoFijos = () => db_abonos_fijos.reduce((s,a) => s + Number(a.monto_abonado), 0);
const tV = () => db_variables.reduce((s,v) => s + Number(v.monto), 0);
const tE = () => tV() + tAbonadoFijos();
const bal = () => tI() - tE();

// Cálculos de Ahorros
const tAhorroHistorico = () => db_ahorros.reduce((s,a) => s + Number(a.monto), 0);
const tAhorroMesActual = () => db_ahorros.filter(a => a.mes_periodo === getPeriodo()).reduce((s,a) => s + Number(a.monto), 0);

function bd() {
  const b = {};
  db_variables.forEach(v => { b[v.categoria] = (b[v.categoria] || 0) + Number(v.monto); });
  db_config_fijos.forEach(f => {
    const abonos = db_abonos_fijos.filter(a => a.id_gasto_fijo === f.id).reduce((s,a) => s + Number(a.monto_abonado), 0);
    if(abonos > 0) b[f.category] = (b[f.category] || 0) + abonos;
  });
  return b;
}

function mc(label, val, color, sub=''){
  return `<div class="mcard"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:6px;">${label}</div><div style="font-size:22px;font-weight:700;color:${color};font-variant-numeric:tabular-nums;">${val}</div>${sub?`<div style="font-size:12px;color:var(--text-muted);margin-top:4px;display:flex;align-items:center;gap:4px;">${sub}</div>`:''}</div>`;
}

function render() {
  if (currentTab === 'overview') renderOverview();
  if (currentTab === 'income') renderIncome();
  if (currentTab === 'expenses') renderExpenses();
  if (currentTab === 'fixed') renderFixed();
  if (currentTab === 'savings') renderSavings();
  if (currentTab === 'tips') renderTips();
}

// ================= PANEL: RESUMEN GENERAL =================
function renderOverview() {
  if (ci) { ci.destroy(); ci = null; }
  const inc = tI(), exp = tE(), b = bal(), savedTotal = tAhorroHistorico(), savedMes = tAhorroMesActual();
  
  const pct = inc > 0 ? Math.round((exp / inc) * 100) : 0;
  const fpct = inc > 0 ? Math.round((tAbonadoFijos() / inc) * 100) : 0;
  const bdo = bd();

  document.getElementById('panel-overview').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem;">
      ${mc('Ingresos', COP(inc), cG(), '<i class="ti ti-trending-up"></i> Entradas')}
      ${mc('Egresos Reales', COP(exp), cR(), '<i class="ti ti-trending-down"></i> Pagos Out')}
      ${mc('Balance Cuenta', COP(b), b>=0?cG():cR(), b>=0?'<i class="ti ti-check"></i> Melo en Caja':'<i class="ti ti-alert-triangle"></i> En déficit')}
      ${mc('Ahorro Total Fijo', COP(savedTotal), cP(), `<i class="ti ti-calendar-stats"></i> Este mes: ${COP(savedMes)}`)}
    </div>

    ${inc > 0 ? `
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;"><i class="ti ti-activity" style="color:var(--money-green);"></i> Indicadores de Salud Financiera</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">
        <div class="mcard"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">Egresos / Ingresos</div><div style="font-size:22px;font-weight:700;color:${pct>90?cR():pct>70?cA():cG()};">${pct}%</div><div style="font-size:12px;margin-top:4px;">${pct>90?'⚠ Gasto crítico':pct>70?'⚡ Cuidado peligro':'✓ Rango seguro'}</div></div>
        <div class="mcard"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">Fijos Pagados / Ingresos</div><div style="font-size:22px;font-weight:700;color:${fpct>50?cR():cG()};">${fpct}%</div><div style="font-size:12px;margin-top:4px;">${fpct>50?'⚠ Mucho compromiso fixed':'✓ Fijos estables'}</div></div>
        <div class="mcard"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">Meta de Ahorro (20%)</div><div style="font-size:22px;font-weight:700;color:${cG()};">${COP(Math.round(inc*.2))}</div><div style="font-size:12px;margin-top:4px;color:var(--text-muted);">Ideal del período</div></div>
      </div>
    </div>` : ''}

    ${Object.keys(bdo).length > 0 ? `
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:14px;"><i class="ti ti-chart-donut" style="color:var(--fixed-blue);"></i> Distribución de Salidas del Mes</div>
      <div style="display:grid;grid-template-columns:1fr 140px;gap:16px;align-items:center;">
        <div>${Object.entries(bdo).sort((a,b)=>b[1]-a[1]).map(([cat,amt],i)=>`
          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;">
              <span><i class="ti ${CICO[cat]||'ti-package'}" style="margin-right:6px;color:var(--text-muted);"></i>${cat}</span>
              <span style="font-weight:600;font-variant-numeric:tabular-nums;">${COP(amt)}</span>
            </div>
            <div class="pbar"><div class="pbar-f" style="width:${exp>0?Math.round((amt/exp)*100):0}%;background:${CC[i%CC.length]};"></div></div>
          </div>`).join('')}
        </div>
        <div style="position:relative;height:140px;"><canvas id="cc"></canvas></div>
      </div>
    </div>` : `<div class="card" style="text-align:center;padding:2.5rem;color:var(--text-muted);"><i class="ti ti-chart-pie" style="font-size:42px;display:block;margin:0 auto 12px;color:var(--border-color);"></i><p style="margin:0;font-size:14px;">Mete movimientos este mes para desbloquear los gráficos en tiempo real.</p></div>`}
  `;

  if(Object.keys(bdo).length > 0){
    setTimeout(() => {
      const cv = document.getElementById('cc'); if(!cv) return;
      ci = new Chart(cv, {
        type: 'doughnut',
        data: { labels: Object.keys(bdo), datasets: [{ data: Object.values(bdo), backgroundColor: CC.slice(0,Object.keys(bdo).length), borderWidth: 0, hoverOffset: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '70%' }
      });
    }, 80);
  }
}

// ================= PANEL: INGRESOS =================
function renderIncome() {
  document.getElementById('panel-income').innerHTML = `
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;"><i class="ti ti-plus" style="color:var(--money-green);"></i> Registrar Nuevo Ingreso Real</div>
      <div class="form-row">
        <input id="iD" placeholder="Ej. Sueldo quincena, Trabajo extra, Freelance..." style="flex:2;" />
        <input id="iA" type="number" placeholder="Monto $" />
        <button class="btn-action" onclick="addI()"><i class="ti ti-plus"></i> Añadir</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:15px;font-weight:600;"><i class="ti ti-list" style="color:var(--text-muted);"></i> Entradas de ${MO[M]}</div>
        <div style="font-size:18px;font-weight:700;color:var(--money-green);font-variant-numeric:tabular-nums;">${COP(tI())}</div>
      </div>
      <div id="income_rows_target"></div>
    </div>`;

  const target = document.getElementById('income_rows_target');
  if(db_ingresos.length === 0) {
    target.innerHTML = `<p style="text-align:center;color:var(--text-muted);padding:1.5rem 0;margin:0;font-size:14px;"><i class="ti ti-cash-off" style="display:block;font-size:32px;margin:0 auto 8px;color:var(--border-color);"></i>Sin registros en este período.</p>`;
  } else {
    target.innerHTML = db_ingresos.map(i => `
      <div class="row-item">
        <div><div style="font-size:14px;font-weight:600;">${i.descripcion}</div></div>
        <div style="display:flex;align-items:center;gap:12px;"><span style="font-weight:700;color:var(--money-green);font-variant-numeric:tabular-nums;">+${COP(i.monto)}</span><button class="btn-del" onclick="rmI('${i.id}')"><i class="ti ti-trash"></i></button></div>
      </div>`).join('');
  }
}

async function addI(){
  const d = document.getElementById('iD').value.trim();
  const a = parseInt(document.getElementById('iA').value);
  if(!d || !a || a <= 0) return;
  await supabase.from('ingresos').insert([{ monto: a, descripcion: d, mes_periodo: getPeriodo() }]);
  await fetchData();
}

async function rmI(id){
  await supabase.from('ingresos').delete().eq('id', id);
  await fetchData();
}

// ================= PANEL: EGRESOS (VARIABLES Y FIJOS COBRADOS) =================
function renderExpenses() {
  const b = bal(), inc = tI(), exp = tE();
  document.getElementById('panel-expenses').innerHTML = `
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;"><i class="ti ti-minus" style="color:var(--expense-red);"></i> Registrar Gasto Diario Variable</div>
      <div class="form-row">
        <input id="eD" placeholder="¿En qué gastaste?" style="flex:2;" />
        <select id="eC">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <input id="eA" type="number" placeholder="Monto $" />
        <button class="btn-action" style="background:var(--expense-red);" onclick="addE()"><i class="ti ti-plus"></i> Descontar</button>
      </div>
    </div>
    <div class="card" style="border-left:4px solid var(--fixed-blue);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:14px;font-weight:600;color:var(--fixed-blue);"><i class="ti ti-pin"></i> Desembolsos Efectuados en Fijos</div>
        <div style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums; color:var(--fixed-blue);">${COP(tAbonadoFijos())}</div>
      </div>
      <div id="fixed_abonos_target"></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:15px;font-weight:600;"><i class="ti ti-shopping-cart" style="color:var(--expense-red);"></i> Bolsa de Gastos Variables Directos</div>
        <div style="font-size:15px;font-weight:700;color:var(--expense-red);font-variant-numeric:tabular-nums;">${COP(tV())}</div>

    </div>`;

    targetF.innerHTML = `<p style="color:var(--text-muted);font-size:12px;margin:0;">No se han inyectado abonos a deudas fijas esta quincena.</p>`;
  } else {
    targetF.innerHTML = db_abonos_fijos.map(a => {

      return `<div class="row-item"><span style="font-size:13px;"><i class="ti ti-check-checkbox" style="color:var(--money-green);"></i> ${ref?ref.name:'Obligación'}</span><span style="font-weight:600;color:var(--fixed-blue); font-size:13px;">-${COP(a.monto_abonado)}</span></div>`;
    }).join('');
  }

  const targetV = document.getElementById('variable_rows_target');
  if(db_variables.length === 0) {
    targetV.innerHTML = `<p style="text-align:center;color:var(--text-muted);padding:1rem 0;margin:0;font-size:13px;">Sin gastos variables anotados.</p>`;
  } else {
    targetV.innerHTML = db_variables.map(v => `
      <div class="row-item">
        <div style="display:flex;align-items:center;gap:10px;">
          <i class="ti ${CICO[v.categoria]||'ti-package'}" style="color:var(--text-muted); font-size:16px;"></i>
          <div>
            <div style="font-size:14px;font-weight:600;">${v.descripcion}</div>

  }
}

async function addE() {
  const d = document.getElementById('eD').value.trim();
  const c = document.getElementById('eC').value;
  const a = parseInt(document.getElementById('eA').value);
  if(!d || !a || a <= 0) return;
  await supabase.from('gastos_variables').insert([{ monto: a, descripcion: d, categoria: c, mes_periodo: getPeriodo() }]);
  await fetchData();
}

async function rmE(id) {
  await supabase.from('gastos_variables').delete().eq('id', id);
  await fetchData();
}

// ================= PANEL: OBLIGACIONES FIJAS =================
function renderFixed() {
  const inc = tI();
  document.getElementById('panel-fixed').innerHTML = `
    <div style="background:rgba(59,130,246,0.1); border:1px solid var(--fixed-blue); border-radius:12px; padding:12px; margin-bottom:16px;">
      <p style="font-size:13px; color:var(--text-main); margin:0; line-height:1.5;">
        <i class="ti ti-info-circle-filled" style="color:var(--fixed-blue);"></i> Control de Compromisos: Los gastos fijos se configuran una sola vez y no alteran tu flujo de caja real hasta que metas un <strong>abono específico</strong> en la quincena correspondiente.
      </p>
    </div>
    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;"><i class="ti ti-circle-plus" style="color:var(--fixed-blue);"></i> Vincular Nueva Obligación Fija Permanente</div>
      <div class="form-row">
        <input id="fN" placeholder="Ej. Arriendo, Internet, Plan Móvil..." style="flex:2;" />
        <select id="fC">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <input id="fA" type="number" placeholder="Monto Mensual Fijo $" />
        <button class="btn-action" style="background:var(--fixed-blue);" onclick="addF()"><i class="ti ti-plus"></i> Enlazar</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div style="font-size:15px;font-weight:600;"><i class="ti ti-lock"></i> Presupuesto Comprometido Mensual</div>
        <div style="font-size:16px;font-weight:700;color:var(--fixed-blue);font-variant-numeric:tabular-nums;">${COP(tF())}/mes</div>
      </div>
      <div id="fixed_configs_target"></div>
    </div>`;

  const target = document.getElementById('fixed_configs_target');
  if(db_config_fijos.length === 0) {
    target.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:13px;">Aún no has enlazado responsabilidades fijas en el sistema.</p>`;
  } else {
    target.innerHTML = db_config_fijos.map(f => {
      const hechos = db_abonos_fijos.filter(a => a.id_gasto_fijo === f.id);
      const abonado = hechos.reduce((s,a) => s + Number(a.monto_abonado), 0);
      const restante = Math.max(0, Number(f.amount) - abonado);

      return `
        <div style="background:var(--bg-input); border-radius:12px; padding:14px; margin-bottom:12px; border:1px solid ${restante===0?'var(--money-green)':'var(--border-color)'};">
          <div style="display:flex; justify-content:space-between; align-items:start;">
            <div>
              <div style="font-size:14px; font-weight:600;"><i class="ti ${CICO[f.category]||'ti-package'}" style="margin-right:4px;"></i> ${f.name}</div>
              <span class="badge" style="background:rgba(59,130,246,0.1);color:var(--fixed-blue); font-size:9px; padding:1px 6px; margin-top:4px;">${f.category}</span>
            </div>
            <div style="text-align:right;">
              <div style="font-size:13px; font-weight:700;">Meta: ${COP(f.amount)}</div>
              <div style="font-size:11px; color:var(--money-green);">Faltante: ${COP(restante)}</div>
            </div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-color);">
            <input id="abo_val_${f.id}" type="number" placeholder="Abonar quincena $" style="background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:6px 10px; border-radius:6px; font-size:12px; flex:1;" />
            <button onclick="addAbonoFijo('${f.id}')" style="background:var(--fixed-blue); border:none; color:white; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;">Procesar</button>
            <button class="btn-del" onclick="rmF('${f.id}')"><i class="ti ti-trash"></i></button>
          </div>
        </div>`;
    }).join('');
  }
}

async function addF() {
  const n = document.getElementById('fN').value.trim();
  const c = document.getElementById('fC').value;
  const a = parseInt(document.getElementById('fA').value);
  if(!n || !a || a <= 0) return;
  await supabase.from('config_fijos').insert([{ name: n, amount: a, category: c }]);
  await fetchData();
}

async function rmF(id) {
  if(confirm("¿Deseas desvincular esta obligación? Se borrarán sus registros.")) {
    await supabase.from('config_fijos').delete().eq('id', id);
    await fetchData();
  }
}

async function addAbonoFijo(idGastoFijo) {
  const input = document.getElementById(`abo_val_${idGastoFijo}`);
  const m = parseInt(input.value);
  if(!m || m <= 0) return;
  await supabase.from('abonos_fijos').insert([{ id_gasto_fijo: idGastoFijo, monto_abonado: m, mes_periodo: getPeriodo() }]);
  input.value = '';
  await fetchData();
}

// ================= PANEL: MÓDULO DE AHORROS PRO (YA HABILITADO) =================
function renderSavings() {
  const totalHistorico = tAhorroHistorico();
  const aporteEsteMes = tAhorroMesActual();
  const gastosReferencia = tE() || tF() || 1200000; 
  
  const ef3 = gastosReferencia * 3;
  const ef6 = gastosReferencia * 6;
  const mesesRespaldo = totalHistorico > 0 ? (totalHistorico / gastosReferencia).toFixed(1) : '0.0';

  document.getElementById('panel-savings').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem;">
      ${mc('Ahorro Histórico Nube', COP(totalHistorico), cP(), '<i class="ti ti-piggy-bank"></i> Total acumulado')}
      ${mc(`Aporte en ${MO[M]}`, COP(aporteEsteMes), cG(), '<i class="ti ti-circle-plus"></i> Indexado al período')}
    </div>

    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:10px;"><i class="ti ti-coins" style="color:var(--money-green);"></i> Guardar capital en el Marrano Cloud</div>
      <div class="form-row">
        <input id="sA" type="number" placeholder="¿Cuánto vas a guardar o transferir hoy? $" style="flex:2;" />
        <button class="btn-action" style="background:var(--saving-purple);" onclick="depS()"><i class="ti ti-lock-square-rounded"></i> Cargar al Fondo</button>
      </div>
    </div>

    <div class="card">
      <div style="font-size:15px;font-weight:600;margin-bottom:12px;"><i class="ti ti-history"></i> Log de Transacciones de Fondos</div>
      <div id="savings_log_target"></div>
    </div>

    <div class="card" style="border-left:4px solid var(--accent-gold);">
      <div style="font-size:15px;font-weight:600;margin-bottom:8px;color:var(--accent-gold);"><i class="ti ti-shield-checkered"></i> Tu Colchón de Emergencias (Escudo Financiero)</div>
      <p style="font-size:13px;color:var(--text-muted);margin:0 0 12px;line-height:1.5;">La regla de oro técnica dicta mantener entre 3 y 6 meses de tus egresos base quietos por si surgen imprevistos mecánicos pesados o eventualidades laborales.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;">
        <div class="mcard"><div style="font-size:11px;color:var(--accent-gold);font-weight:600;margin-bottom:4px;">Mínimo Técnico (3 Meses)</div><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;">${COP(ef3)}</div></div>
        <div class="mcard"><div style="font-size:11px;color:var(--accent-gold);font-weight:600;margin-bottom:4px;">Nivel Pro Real (6 Meses)</div><div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;">${COP(ef6)}</div></div>
      </div>
      <div style="padding:12px;background:var(--bg-input);border-radius:10px;font-size:13px;">
        Tu fondo de reserva actual respalda aproximadamente <strong>${mesesRespaldo} meses</strong> de tus gastos normales de vida. 
        ${parseFloat(mesesRespaldo) >= 3 ? `<span style="color:var(--money-green); font-weight:600;">✓ ¡Estás blindado!</span>` : `<span style="color:var(--accent-gold);">Te faltan ${COP(Math.max(0, Math.round(ef3 - totalHistorico)))} para alcanzar el blindaje mínimo.</span>`}
      </div>
    </div>`;

  const logTarget = document.getElementById('savings_log_target');
  const registrosMes = db_ahorros.filter(a => a.mes_periodo === getPeriodo());
  if(registrosMes.length === 0) {
    logTarget.innerHTML = `<p style="color:var(--text-muted); font-size:13px; margin:0;">No se registran aportes de ahorro durante este mes todavía.</p>`;
  } else {
    logTarget.innerHTML = registrosMes.map(a => `
      <div class="row-item">
        <span style="font-size:13px;"><i class="ti ti-arrow-bar-to-down" style="color:var(--saving-purple);"></i> Depósito Seguro</span>
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-weight:700; color:var(--saving-purple); font-size:13px;">+${COP(a.monto)}</span>
          <button class="btn-del" onclick="rmSavings('${a.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('');
  }
}

async function depS() {
  const val = parseInt(document.getElementById('sA').value);
  if(!val || val <= 0) return;
  await supabase.from('ahorros').insert([{ monto: val, mes_periodo: getPeriodo() }]);
  await fetchData();
}

async function rmSavings(id) {
  await supabase.from('ahorros').delete().eq('id', id);
  await fetchData();
}

          <div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;">${COP(idealFijos)}</div>

// ================= NAVEGACIÓN ENTRE PERIODOS MENSUALES =================
function setupMonthNavigation() {
  document.getElementById('prevBtn').addEventListener('click', async () => { M--; if(M < 0){ M = 11; Y--; } await fetchData(); });
  document.getElementById('nextBtn').addEventListener('click', async () => { M++; if(M > 11){ M = 0; Y++; } await fetchData(); });
}

function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => {
      currentTab = b.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
      b.classList.add('active');
      b.setAttribute('aria-selected','true');
      
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const cp = document.getElementById(`panel-${currentTab}`);
      if (cp) cp.classList.add('active');
      render();
    });
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>

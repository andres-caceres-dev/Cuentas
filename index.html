<h2 class="sr-only">Control de finanzas personales — tablero mensual de ingresos, egresos y ahorro</h2>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg-main: #0b1215;
    --bg-card: #141f23;
    --bg-input: #1c2a30;
    --border-color: #24373e;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    
    /* Colores financieros */
    --money-green: #10b981;
    --expense-red: #ef4444;
    --fixed-blue: #3b82f6;
    --accent-gold: #f59e0b;
    --saving-purple: #a855f7;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 12px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 1.25rem;
    margin-bottom: 16px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
  }

  .tabs-container {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 1.5rem;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }

  .tab-btn {
    padding: 10px 18px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    border-radius: 20px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    color: #fff;
    background: var(--money-green);
    border-color: var(--money-green);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .row-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border-color);
  }
  .row-item:last-child { border-bottom: none; }

  .form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 10px;
  }
  .form-row input, .form-row select {
    flex: 1;
    min-width: 140px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }

  button.btn-action {
    background: var(--money-green);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-del {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--expense-red);
    padding: 6px;
  }

  .pbar { height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .pbar-f { height: 100%; border-radius: 4px; transition: width .5s ease; }
</style>

<div style="padding: 1rem 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
  <div>
    <h1 style="font-size: 22px; font-weight: 600; margin: 0 0 4px; display: flex; align-items: center; gap: 8px;">
      <i class="ti ti-database-share" style="color: var(--money-green);"></i> MiBilletón Cloud
    </h1>
    <p style="font-size: 13px; color: var(--text-muted); margin: 0;">Sincronizado en tiempo real con Supabase</p>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 30px; padding: 6px 14px;">
    <button id="prevBtn" style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-main);"><i class="ti ti-chevron-left"></i></button>
    <span id="monthLabel" style="font-size: 14px; font-weight: 600; min-width: 110px; text-align: center; text-transform: capitalize;">Buscando...</span>
    <button id="nextBtn" style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-main);"><i class="ti ti-chevron-right"></i></button>
  </div>
</div>

<div class="tabs-container" role="tablist">
  <button class="tab-btn active" data-tab="overview"><i class="ti ti-layout-dashboard"></i>Resumen Cuenta</button>
  <button class="tab-btn" data-tab="income"><i class="ti ti-square-rounded-arrow-down" style="color: var(--money-green);"></i>Ingresos</button>
  <button class="tab-btn" data-tab="expenses"><i class="ti ti-square-rounded-arrow-up" style="color: var(--expense-red);"></i>Gastos Variables</button>
  <button class="tab-btn" data-tab="fixed"><i class="ti ti-pin" style="color: var(--fixed-blue);"></i>Obligaciones Fijas</button>
  <button class="tab-btn" data-tab="savings"><i class="ti ti-piggy-bank" style="color: var(--saving-purple);"></i>Ahorro</button>
  <button class="tab-btn" data-tab="tips"><i class="ti ti-bulb" style="color: var(--accent-gold);"></i>Consejos</button>
</div>

<div id="panel-overview" class="panel active">Inicializando el sistema...</div>
<div id="panel-income" class="panel"></div>
<div id="panel-expenses" class="panel"></div>
<div id="panel-fixed" class="panel"></div>
<div id="panel-savings" class="panel"></div>
<div id="panel-tips" class="panel"></div>

<script>
// =============== CONFIGURACIÓN GLOBAL ===============
const SB_URL = "https://pknkexsoidbvseftndos.supabase.co"; 
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrbmtleHNvaWRidnNlZnRuZG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0OTU5NjAsImV4cCI6MjA5NTA3MTk2MH0.n7jBEp608AxcGaGawJCCwyG8cAhEM_R311Z7xTpP5Jo";

let supabase = null;

const MO=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CATS=['Alimentación','Transporte','Vivienda','Salud','Educación','Entretenimiento','Servicios','Deudas','Otros'];
const CICO={'Alimentación':'ti-soup','Transporte':'ti-motorbike','Vivienda':'ti-home-2','Salud':'ti-heart-handshake','Educación':'ti-book-2','Entretenimiento':'ti-device-gamepad-2','Servicios':'ti-bolt','Deudas':'ti-building-bank','Otros':'ti-package'};

let Y = new Date().getFullYear(), M = new Date().getMonth();
let db_ingresos = [], db_variables = [], db_config_fijos = [], db_abonos_fijos = [];
let currentTab = 'overview';
let chartCaja = null, chartFijos = null;

const COP = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',minimumFractionDigits:0}).format(n||0);
const getPeriodo = () => `${Y}_${String(M+1).padStart(2,'0')}`;

// Función que fuerza la espera de la librería externa en memoria antes de instanciar
function inicializarClienteSeguro() {
  const SupabaseLib = window.supabase || (window.Supabase && window.Supabase.createClient ? window.Supabase : null);
  
  if (SupabaseLib) {
    if (typeof SupabaseLib.createClient === 'function') {
      supabase = SupabaseLib.createClient(SB_URL, SB_KEY);
    } else if (typeof SupabaseLib === 'function') {
      supabase = SupabaseLib(SB_URL, SB_KEY);
    }
    return true;
  }
  return false;
}

async function init() {
  setupTabs();
  setupMonthNavigation();
  document.getElementById('monthLabel').innerText = `${MO[M]} ${Y}`;
  
  // Si no encuentra la librería al instante, espera un bucle de 300ms (útil para archivos locales)
  let conecto = inicializarClienteSeguro();
  if (!conecto) {
    await new Promise(resolve => setTimeout(resolve, 300));
    conecto = inicializarClienteSeguro();
  }

  if (!supabase) {
    document.getElementById('panel-overview').innerHTML = `
      <div class="card" style="border-color: var(--expense-red); padding: 2rem; text-align: center;">
        <i class="ti ti-alert-triangle" style="font-size: 40px; color: var(--expense-red);"></i>
        <h3 style="margin: 10px 0 6px;">Error de Enlace CDN</h3>
        <p style="color: var(--text-muted); font-size: 14px; margin: 0;">El navegador bloqueó la descarga de la librería Supabase desde internet. Verifica tu conexión de red o refresca la pestaña.</p>
      </div>
    `;
    return;
  }
  await fetchData();
}

async function fetchData() {
  try {
    const per = getPeriodo();
    document.getElementById('monthLabel').innerText = `${MO[M]} ${Y}`;
    document.getElementById('panel-overview').innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px;">Consultando base de datos...</p>`;

    const [f1, f2, f3, f4] = await Promise.all([
      supabase.from('config_fijos').select('*'),
      supabase.from('ingresos').select('*').eq('mes_periodo', per),
      supabase.from('gastos_variables').select('*').eq('mes_periodo', per),
      supabase.from('abonos_fijos').select('*').eq('mes_periodo', per)
    ]);

    db_config_fijos = f1.data || [];
    db_ingresos = f2.data || [];
    db_variables = f3.data || [];
    db_abonos_fijos = f4.data || [];

    render();
  } catch (error) {
    console.error("Error cargando datos de Supabase:", error);
    document.getElementById('panel-overview').innerHTML = `
      <div class="card" style="border-color: var(--accent-gold); text-align: center;">
        <p style="color: var(--accent-gold); margin: 0;">Error de comunicación con PostgreSQL. Revisa la configuración de tus políticas RLS.</p>
      </div>
    `;
  }
}

function render() {
  if (currentTab === 'overview') renderOverview();
  if (currentTab === 'income') renderIncome();
  if (currentTab === 'expenses') renderExpenses();
  if (currentTab === 'fixed') renderFixed();
  if (currentTab === 'savings') renderSavings();
  if (currentTab === 'tips') renderTips();
}

// ================== DASHBOARDS (PESTAÑA RESUMEN) ==================
function renderOverview() {
  if (chartCaja) chartCaja.destroy();
  if (chartFijos) chartFijos.destroy();

  const totalIngresos = db_ingresos.reduce((s,i) => s + Number(i.monto), 0);
  const totalVariables = db_variables.reduce((s,v) => s + Number(v.monto), 0);
  const totalAbonadoFijos = db_abonos_fijos.reduce((s,a) => s + Number(a.monto_abonado), 0);
  
  const totalEgresosReales = totalVariables + totalAbonadoFijos;
  const saldoEspejoCuenta = totalIngresos - totalEgresosReales;

  const metaFijosMensual = db_config_fijos.reduce((s,f) => s + Number(f.amount), 0);
  const fijosPendientes = Math.max(0, metaFijosMensual - totalAbonadoFijos);
  const porcMeteFijos = metaFijosMensual > 0 ? Math.min(100, Math.round((totalAbonadoFijos / metaFijosMensual) * 100)) : 0;

  document.getElementById('panel-overview').innerHTML = `
    <div style="background: linear-gradient(135deg, #142329 0%, #0b1215 100%); border:1px solid var(--money-green); border-radius:16px; padding:1.5rem; margin-bottom:16px;">
      <div style="font-size:12px; font-weight:600; text-transform:uppercase; color:var(--money-green); letter-spacing:1px;"><i class="ti ti-building-bank"></i> Saldo Neto Disponible en Cuenta</div>
      <div style="font-size:36px; font-weight:800; color:#fff; margin:6px 0; font-variant-numeric: tabular-nums;">${COP(saldoEspejoCuenta)}</div>
      <p style="font-size:13px; color:var(--text-muted); margin:0;">Calculado de: ${COP(totalIngresos)} recibidos menos ${COP(totalEgresosReales)} que ya salieron físicamente.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:16px;">
      <div class="card">
        <div style="font-size:15px; font-weight:600; margin-bottom:4px;"><i class="ti ti-chart-donut" style="color:var(--money-green);"></i> Uso de tu Plata Real</div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">Egresos reales del mes quincenal</div>
        <div style="display:grid; grid-template-columns: 1fr 120px; gap:12px; align-items:center;">
          <div>
            <div style="font-size:13px; margin-bottom:6px;">Gastos Variables: <strong style="color:var(--expense-red);">${COP(totalVariables)}</strong></div>
            <div style="font-size:13px; margin-bottom:6px;">Abonos Fijos Hechos: <strong style="color:var(--fixed-blue);">${COP(totalAbonadoFijos)}</strong></div>
          </div>
          <div style="height:120px; position:relative;">
            ${totalEgresosReales > 0 ? `<canvas id="chartCajaCanvas"></canvas>` : `<div style="font-size:11px; color:var(--text-muted); text-align:center; padding-top:40px;">Sin egresos aún</div>`}
          </div>
        </div>
      </div>

      <div class="card">
        <div style="font-size:15px; font-weight:600; margin-bottom:4px;"><i class="ti ti-target-arrow" style="color:var(--accent-gold);"></i> Termómetro de Fijos</div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">Meta total comprometida: <strong>${COP(metaFijosMensual)}</strong></div>
        <div style="display:grid; grid-template-columns: 1fr 120px; gap:12px; align-items:center;">
          <div>
            <div style="font-size:13px; margin-bottom:4px;">Progreso de Cobertura: <strong style="color:var(--money-green);">${porcMeteFijos}%</strong></div>
            <div class="pbar" style="margin-bottom:10px;"><div class="pbar-f" style="width:${porcMeteFijos}%; background:var(--fixed-blue);"></div></div>
            <div style="font-size:16px; font-weight:700; color:var(--expense-red);">${COP(fijosPendientes)}</div>
          </div>
          <div style="height:120px; position:relative;">
            ${metaFijosMensual > 0 ? `<canvas id="chartFijosCanvas"></canvas>` : `<div style="font-size:11px; color:var(--text-muted); text-align:center; padding-top:40px;">Sin obligaciones fijas</div>`}
          </div>
        </div>
      </div>
    </div>
  `;

  setTimeout(() => {
    const ctxCaja = document.getElementById('chartCajaCanvas');
    if(ctxCaja && totalEgresosReales > 0) {
      chartCaja = new Chart(ctxCaja, {
        type: 'doughnut',
        data: { labels: ['Variables', 'Fijos'], datasets: [{ data: [totalVariables, totalAbonadoFijos], backgroundColor: ['#ef4444', '#3b82f6'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
      });
    }
    const ctxFijos = document.getElementById('chartFijosCanvas');
    if(ctxFijos && metaFijosMensual > 0) {
      chartFijos = new Chart(ctxFijos, {
        type: 'doughnut',
        data: { labels: ['Cubierto', 'Faltante'], datasets: [{ data: [totalAbonadoFijos, fijosPendientes], backgroundColor: ['#10b981', '#1c2a30'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
      });
    }
  }, 50);
}

// ================= PANEL: INGRESO DE DINERO =================
function renderIncome() {
  document.getElementById('panel-income').innerHTML = `
    <div class="card">
      <div style="font-size:15px; font-weight:600; margin-bottom:12px;"><i class="ti ti-plus" style="color:var(--money-green);"></i> Registrar Entrada de Dinero</div>
      <div class="form-row">
        <input id="in_desc" placeholder="Ej. Primera Quincena, Extra..." style="flex:2;" />
        <input id="in_monto" type="number" placeholder="Monto $" />
        <button class="btn-action" onclick="addIngreso()"><i class="ti ti-plus"></i> Cargar</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:15px; font-weight:600; margin-bottom:12px;">Historial de Ingresos de este Mes</div>
      <div id="income_list"></div>
    </div>
  `;
  const list = document.getElementById('income_list');
  if (db_ingresos.length === 0) {
    list.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:14px; padding:12px 0;">No hay ingresos reportados.</p>`;
  } else {
    list.innerHTML = db_ingresos.map(i => `
      <div class="row-item">
        <div><div style="font-size:14px; font-weight:600;">${i.descripcion}</div></div>
        <div style="display:flex; align-items:center; gap:12px;"><span style="color:var(--money-green); font-weight:700;">+${COP(i.monto)}</span><button class="btn-del" onclick="delIngreso('${i.id}')"><i class="ti ti-trash"></i></button></div>
      </div>
    `).join('');
  }
}

async function addIngreso() {
  const d = document.getElementById('in_desc').value.trim();
  const m = parseInt(document.getElementById('in_monto').value);
  if(!d || !m || m <= 0) return;
  await supabase.from('ingresos').insert([{ monto: m, descripcion: d, mes_periodo: getPeriodo() }]);
  await fetchData();
}

async function delIngreso(id) {
  await supabase.from('ingresos').delete().eq('id', id);
  await fetchData();
}

// ================= PANEL: GASTOS VARIABLES =================
function renderExpenses() {
  document.getElementById('panel-expenses').innerHTML = `
    <div class="card">
      <div style="font-size:15px; font-weight:600; margin-bottom:12px;"><i class="ti ti-minus" style="color:var(--expense-red);"></i> Registrar Gasto del Día a Día</div>
      <div class="form-row">
        <input id="ex_desc" placeholder="¿En qué gastaste plata?" style="flex:2;" />
        <select id="ex_cat">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <input id="ex_monto" type="number" placeholder="Monto $" />
        <button class="btn-action" style="background:var(--expense-red);" onclick="addVariable()"><i class="ti ti-plus"></i> Descontar</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:15px; font-weight:600; margin-bottom:12px;">Historial de Gastos Diarios</div>
      <div id="var_list"></div>
    </div>
  `;
  const list = document.getElementById('var_list');
  if (db_variables.length === 0) {
    list.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:14px; padding:12px 0;">No hay gastos variables todavía.</p>`;
  } else {
    list.innerHTML = db_variables.map(v => `
      <div class="row-item">
        <div style="display:flex; align-items:center; gap:10px;"><i class="ti ${CICO[v.categoria]||'ti-package'}" style="color:var(--text-muted);"></i><div><div style="font-size:14px; font-weight:600;">${v.descripcion}</div></div></div>
        <div style="display:flex; align-items:center; gap:12px;"><span style="color:var(--expense-red); font-weight:700;">-${COP(v.monto)}</span><button class="btn-del" onclick="delVariable('${v.id}')"><i class="ti ti-trash"></i></button></div>
      </div>
    `).join('');
  }
}

async function addVariable() {
  const d = document.getElementById('ex_desc').value.trim();
  const c = document.getElementById('ex_cat').value;
  const m = parseInt(document.getElementById('ex_monto').value);
  if(!d || !m || m <= 0) return;
  await supabase.from('gastos_variables').insert([{ monto: m, descripcion: d, categoria: c, mes_periodo: getPeriodo() }]);
  await fetchData();
}

async function delVariable(id) {
  await supabase.from('gastos_variables').delete().eq('id', id);
  await fetchData();
}

// ================= PANEL: OBLIGACIONES FIJAS =================
function renderFixed() {
  document.getElementById('panel-fixed').innerHTML = `
    <div class="card">
      <div style="font-size:15px; font-weight:600; margin-bottom:12px;"><i class="ti ti-circle-plus" style="color:var(--fixed-blue);"></i> Vincular Nueva Obligación Mensual</div>
      <div class="form-row">
        <input id="fx_name" placeholder="Ej. Cuota Moto, Internet..." style="flex:2;" />
        <select id="fx_cat">${CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <input id="fx_monto" type="number" placeholder="Monto Mensual" />
        <button class="btn-action" style="background:var(--fixed-blue);" onclick="addConfigFijo()"><i class="ti ti-plus"></i> Vincular</button>
      </div>
    </div>
    <div class="card">
      <div style="font-size:15px; font-weight:600; margin-bottom:16px;"><i class="ti ti-checklist"></i> Estado de Pagos Quincenales</div>
      <div id="fixed_cards_container"></div>
    </div>
  `;

  const container = document.getElementById('fixed_cards_container');
  if(db_config_fijos.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:14px; padding:12px 0;">No has configurado obligaciones fijas.</p>`;
    return;
  }

  container.innerHTML = db_config_fijos.map(f => {
    const abonosHec = db_abonos_fijos.filter(a => a.id_gasto_fijo === f.id);
    const totalAbonado = abonosHec.reduce((s,a) => s + Number(a.monto_abonado), 0);
    const pendiente = Math.max(0, Number(f.amount) - totalAbonado);

    return `
      <div style="background:var(--bg-input); border-radius:12px; padding:14px; margin-bottom:12px; border:1px solid ${pendiente===0?'var(--money-green)':'var(--border-color)'};">
        <div style="display:flex; justify-content:space-between; align-items:start;">
          <div>
            <div style="font-size:14px; font-weight:600;"><i class="ti ${CICO[f.category]||'ti-package'}"></i> ${f.name}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:13px; font-weight:700;">Meta: ${COP(f.amount)}</div>
            <div style="font-size:12px; color:var(--money-green);">Abonado: ${COP(totalAbonado)}</div>
          </div>
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-color);">
          <input id="abo_val_${f.id}" type="number" placeholder="Monto quincena" style="background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:6px 10px; border-radius:6px; font-size:12px; flex:1;" />
          <button onclick="addAbonoFijo('${f.id}')" style="background:var(--fixed-blue); border:none; color:white; padding:6px 12px; border-radius:6px; cursor:pointer;">Abonar</button>
          <button class="btn-del" onclick="delConfigFijo('${f.id}')"><i class="ti ti-trash"></i></button>
        </div>
      </div>
    `;
  }).join('');
}

async function addConfigFijo() {
  const n = document.getElementById('fx_name').value.trim();
  const c = document.getElementById('fx_cat').value;
  const m = parseInt(document.getElementById('fx_monto').value);
  if(!n || !m || m <= 0) return;
  await supabase.from('config_fijos').insert([{ name: n, amount: m, category: c }]);
  await fetchData();
}

async function delConfigFijo(id) {
  if(confirm("¿Seguro?")) {
    await supabase.from('config_fijos').delete().eq('id', id);
    await fetchData();
  }
}

async function addAbonoFijo(idGastoFijo) {
  const input = document.getElementById(`abo_val_${idGastoFijo}`);
  const m = parseInt(input.value);
  if(!m || m <= 0) return;
  await supabase.from('abonos_fijos').insert([{ id_gasto_fijo: idGastoFijo, monto_abonado: m, mes_periodo: getPeriodo() }]);
  input.value = '';
  await fetchData();
}

// ================= NAVEGACIÓN Y TABS =================
function setupTabs() {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.addEventListener('click', () => {
      currentTab = b.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById(`panel-${currentTab}`).classList.add('active');
      render();
    });
  });
}

function setupMonthNavigation() {
  document.getElementById('prevBtn').addEventListener('click', async () => { M--; if(M < 0){ M = 11; Y--; } await fetchData(); });
  document.getElementById('nextBtn').addEventListener('click', async () => { M++; if(M > 11){ M = 0; Y++; } await fetchData(); });
}

// Ejecución controlada apenas el DOM base esté listo
document.addEventListener('DOMContentLoaded', init);
</script>
